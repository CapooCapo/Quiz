name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-vercel-main
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy Staging
    environment: Staging

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest
    outputs:
      url: ${{steps.deploy.outputs.url}}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify current main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT_SHA" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Staging Environment
        run: |
          vercel pull --yes \
            --environment=preview \
            --token "$VERCEL_TOKEN"

      - name: Deploy Staging
        id: deploy
        run: |
          URL="$(vercel deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $URL"

      - name: Smoke Test Staging
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          echo "Testing Staging: $PREVIEW_URL"

          vercel curl "$PREVIEW_URL" -- -f -s -S -L -o /dev/null

          echo "Staging smoke test PASSED"

  production:
    name: Deploy Production
    needs: staging
    runs-on: ubuntu-latest
    environment: Production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      STAGING_URL: ${{ needs.staging.outputs.url }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Production Inputs
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$STAGING_URL"
          test -n "$PRODUCTION_URL"

          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Main has changed. Deployment stopped."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote to Production
        run: |
          set -euo pipefail

          vercel promote "$STAGING_URL" \
            --yes \
            --timeout=10m \
            --token "$VERCEL_TOKEN"

      - name: Smoke Test Production
        run: |
          set -euo pipefail

          PRODUCTION_URL="${PRODUCTION_URL%/}"

          echo "Checking Production homepage..."
          curl -fsSL --retry 3 \
            --retry-delay 2 \
            "$PRODUCTION_URL/" -o /dev/null

          echo "Checking IELTS Writing..."
          curl -fsSL --retry 3 \
            --retry-delay 2 \
            "$PRODUCTION_URL/ielts-writing" -o /dev/null

          echo "Production Smoke Test PASSED"
